# =============================================================================
# Pick 本地开发中间件 — 统一 Docker Compose（与手动容器配置一致）
# 包含: MySQL 8.0 + Redis 6.0 + Kafka (wurstmeister/ZK) + Zookeeper 3.8
# Milvus 部分已手动启动，不使用 compose 管理
# =============================================================================

networks:
  kafka-net:
    external: true

services:
  # ======================== MySQL 5.7 ========================
  mysql:
    image: mysql:8.0
    container_name: mysql57
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
      - --skip-character-set-client-handshake
    volumes:
      - mysql57-data:/var/lib/mysql
    restart: unless-stopped

  # ======================== Redis 6.0.8 ========================
  redis:
    image: redis:6.0.8
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server
    restart: unless-stopped

  # ======================== Zookeeper 3.8 ========================
  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    networks:
      - default
      - kafka-net

  # ======================== Kafka (wurstmeister) ========================
  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: "0"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
    depends_on:
      - zookeeper
    restart: "no"
    networks:
      - kafka-net

volumes:
  mysql57-data:
    external: true
